[defaults]
# Default inventory for this repository
inventory = ./inventory/hosts.ini

# Where to search for roles (repo roles first)
roles_path = ./roles:./playbooks/roles

# Log file for ansible runs
log_path = ./ansible.log

# Use the discovered Python interpreter without emitting warnings
# (targets range from Ubuntu to CentOS 8 with different python paths).
interpreter_python = auto_silent

# NOTE (lab only): disable host key checking so freshly cloned VMs don't block
# the first connection on an unknown-host prompt. Set back to True for prod.
host_key_checking = False

# group_vars/host_vars adjacent to the inventory and the playbook are loaded
# automatically by the default host_group_vars vars plugin. In this repo the
# variables live in: inventory/group_vars/all.yml
# (The previous inventory_group_vars/repo_group_vars/vars_plugins keys were NOT
#  valid Ansible options and were silently ignored.)

[ssh_connection]
# Speed up repeated runs against the lab; harmless on a single run.
pipelining = true
