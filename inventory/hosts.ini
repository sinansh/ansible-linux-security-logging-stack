# ─────────────────────────────────────────────────────────────────────────────
# Envanter. Gerçek hostlarınızı aşağıdaki gruplara ekleyin.
# Playbook 'linux_servers' grubunu hedefler; alt grupları ona dahil ediyoruz.
# ─────────────────────────────────────────────────────────────────────────────

[ubuntu_servers]
# ubuntu1 ansible_host=192.0.2.11 ansible_user=op
# ubuntu2 ansible_host=192.0.2.12 ansible_user=op

[centos_servers]
# centos1 ansible_host=192.0.2.21 ansible_user=op

# Üst grup: tüm Linux hedefleri tek seferde
[linux_servers:children]
ubuntu_servers
centos_servers

[linux_servers:vars]
# Tüm hedeflerde sudo kullan (parolalı sudo ise: --ask-become-pass / -K ekleyin)
ansible_become=true
ansible_become_method=sudo
# ansible_user=op
# ansible_port=22
# Anahtarla bağlanıyorsanız:
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
