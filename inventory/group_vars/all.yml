---
# ═════════════════════════════════════════════════════════════════════════════
# inventory/group_vars/all.yml
#
# Bu dosya envantere bitisik oldugu icin TUM hostlara otomatik uygulanir.
# Bu yuzden buraya YALNIZCA ortamin tamaminda gecerli olan seyler yazilir.
# Role/rol grubuna ozgu gurultu dislama kurallari group_vars/<grup>.yml veya
# host_vars/<host>.yml altina gider. (Ornek: k8s node'lari icin asagiya bkz.)
# ═════════════════════════════════════════════════════════════════════════════

# ── SIEM hedefi ─────────────────────────────────────────────────────────────
# ⚠️ KENDI SIEM/collector ADRESINIZLE DEGISTIRIN
siem_host: "192.168.41.100"
siem_port: 514
siem_protocol: "tcp"        # tcp | udp  (lab testinde tcp: teslimi dogrulamak kolay)

# ── Dosya yollari ───────────────────────────────────────────────────────────
sysmon_config_path: "/etc/sysmon/sysmon-config.xml"
audit_rules_path: "/etc/audit/rules.d/99-siem.rules"

# ── Ortam sabitleri ─────────────────────────────────────────────────────────
zabbix_server_ip: "192.168.41.101"
dns_resolver_vips:            # DNS sunuculari
  - "192.168.41.12"
  - "192.168.41.13"
         

# ═════════════════════════════════════════════════════════════════════════════
# EID 1 — ProcessCreate dislama
# ═════════════════════════════════════════════════════════════════════════════
# ── Imza bazli dislama: kimlik + TAM komut satiri + (ops.) user ─────────────
# 5 dakikalik olcumde 82 ProcessCreate olayinin TAMAMI bu imzalardan geliyordu
# (4 host, Zabbix 60sn poll araligi). 535 endpoint'e olceklendiginde
# ~131K olay/saat eder.
#
# Neden Image bazli genis dislama DEGIL: bu imzalarin binary'leri dash, bash,
# who, wc — saldirganin en cok kullandiklari. Toptan susturmak reverse shell
# ve 'curl | bash' zincirlerini de kor ederdi.
processcreate_excluded_signatures:

  # Zabbix system.users.num — her poll 3 process uretir.
  # 'sh -c ...' bazi hostlarda dash, bazilarinda bash olarak calisiyor;
  # ikisi de ayri imza olarak tanimli.
  - name: "zbx-users-num-sh-dash"
    image: "/usr/bin/dash"
    commandline: "sh -c who | wc -l"
    user: "zabbix"
  - name: "zbx-users-num-sh-bash"
    image: "/usr/bin/bash"
    commandline: "sh -c who | wc -l"
    user: "zabbix"
  - name: "zbx-users-num-who"
    image: "/usr/bin/who"
    commandline: "who"
    user: "zabbix"
  - name: "zbx-users-num-wc"
    image: "/usr/bin/wc"
    commandline: "wc -l"
    user: "zabbix"

  # Zabbix UserParameter'lari — root olarak calisiyor, bu yuzden 'user'
  # kisiti yok (root kisiti hicbir daraltma saglamaz). Daraltici olan
  # komut satirinin kendisi.
  - name: "zbx-vm-memory-free"
    image: "/usr/bin/gawk"
    commandline: "awk /^(MemFree|Buffers|Cached):/ {free += $2}; END {print free} /proc/meminfo"
  - name: "zbx-sum-agg"
    image: "/usr/bin/gawk"
    commandline: "awk { sum += $1 }; END { print 0+sum }"
  - name: "zbx-qemu-discovery"
    image: "/usr/bin/pgrep"
    commandline: "pgrep -d   -- ^qemu(-(kvm|system-.+)|:.{1,11})$"
  - name: "zbx-sleep-poll"
    image: "/usr/bin/sleep"
    commandline: "sleep 60"

  # sysstat cron (Debian/Ubuntu)
  - name: "sysstat-sa1-outer"
    image: "/usr/bin/dash"
    commandline: "/bin/sh -c command -v debian-sa1 > /dev/null && debian-sa1 1 1"
  - name: "sysstat-sa1-inner"
    image: "/usr/bin/dash"
    commandline: "/bin/sh /usr/lib/sysstat/debian-sa1 1 1"

processcreate_excluded_images:
  - "/usr/sbin/cron"
  - "/usr/sbin/crond"
  - "/usr/bin/monit"
  - "/usr/lib/systemd/systemd-journald"
  - "/usr/bin/dbus-daemon"

processcreate_excluded_commandlines:
  - "ansible-playbook"

# ═════════════════════════════════════════════════════════════════════════════
# EID 3 — NetworkConnect dislama
#
# KURAL: binary bazinda genel dislama YAZILMAZ. Her giris
#   kimlik (Image) + peer IP + port
# uclusunu birden saglayan DAR bir akistir. Ucunden biri sapan her baglanti
# LOGLANIR — ajan uzerinden C2, yanal hareket, beklenmedik peer gorunur kalir.
#
# Yeni bir satir eklemeden once sorun: "bu kural, bu binary'nin ele
# gecirilmesi halinde saldirganin isine yarar mi?" Cevap evet ise kurali
# daraltin, kapsamini genisletmeyin.
# ═════════════════════════════════════════════════════════════════════════════
sysmon_network_flow_exclusions:

  # Zabbix passive check: Zabbix srv -> agent :10050 (gelen)
  - name: "zabbix-passive-poll"
    image: "/usr/sbin/zabbix_agent2"
    peer_ip: "{{ zabbix_server_ip }}"
    direction: "inbound"
    port: 10050

  # Zabbix active check: agent -> Zabbix srv :10051 (giden)
  - name: "zabbix-active-checks"
    image: "/usr/sbin/zabbix_agent2"
    peer_ip: "{{ zabbix_server_ip }}"
    direction: "outbound"
    port: 10051

  # Kendi log iletimimiz: rsyslogd -> SIEM collector
  # Bu akisi susturmak, rsyslogd'nin BASKA bir hedefe log yonlendirmesini
  # (exfiltrasyon) gorunur birakir — cunku peer + port sabitlenmis durumda.
  - name: "rsyslog-to-siem"
    image: "/usr/sbin/rsyslogd"
    peer_ip: "{{ siem_host }}"
    direction: "outbound"
    port: "{{ siem_port }}"

# ═════════════════════════════════════════════════════════════════════════════
# EID 5 — ProcessTerminate
# Linux'ta Image alani CIPLAK PROCESS ADIDIR ("multipathd"), tam yol degil.
# "begin with /" ile catch-all yazmayin; hicbir seyi susturmaz.
# ═════════════════════════════════════════════════════════════════════════════
processterminate_enabled: false       # false -> EID 5 tamamen kapali
processterminate_excluded_images:     # yalnizca enabled: true iken kullanilir
  - "multipathd"
  - "gpg-agent"
  - "udisksd"

# ═════════════════════════════════════════════════════════════════════════════
# KULLANIMDAN KALDIRILDI — yeni sablon bu degiskenleri OKUMAZ.
# Bos birakildi ki roldeki eski assert dongusu kirilmasin. Rol
# guncellendikten sonra bu iki satir da silinmelidir.
#
# Neden kaldirildi: her ikisi de tek alanli genel dislamaydi. IP tabanli
# olan gelen baglantilari hic yakalamiyordu (peer o durumda SourceIp'te),
# image tabanli olan ise ilgili binary'nin TUM ag davranisini kor ediyordu.
# ═════════════════════════════════════════════════════════════════════════════
sysmon_excluded_destination_ips: []
sysmon_excluded_network_images: []