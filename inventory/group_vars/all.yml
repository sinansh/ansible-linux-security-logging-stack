---
# ─────────────────────────────────────────────────────────────────────────────
# Bu dosya envantere bitişik olduğu için (inventory/group_vars/all.yml) TÜM
# hostlar için otomatik yüklenir. SIEM hedefini burada ayarlayın.
# ─────────────────────────────────────────────────────────────────────────────

# SIEM destination  ───  ⚠️ KENDİ SIEM/collector ADRESİNİZLE DEĞİŞTİRİN
siem_host: "192.168.42.129"
siem_port: 514
siem_protocol: "tcp"        # tcp | udp  (lab testinde tcp önerilir: teslimi doğrulamak kolay)

# Sysmon (olaylar syslog'a tag=sysmon ile gider; ayrı log dosyası yok)
sysmon_config_path: "/etc/sysmon/sysmon-config.xml"

# Auditd kural dosyası (rules.d altında augenrules ile yüklenir)
audit_rules_path: "/etc/audit/rules.d/99-siem.rules"

# Sysmon NetworkConnect exclusion — hedef IP listesi
# Zabbix, monitoring vb. araçların hedef IP'lerini buraya ekleyin.
sysmon_excluded_destination_ips:
  - "192.168.42.129"

# Sysmon NetworkConnect exclusion — image (binary path) listesi
# NetworkConnect üretmesini istemediğiniz gürültülü process'leri buraya ekleyin.
sysmon_excluded_network_images:
  # Zabbix
  - "/usr/sbin/zabbix_agent2"
  - "/usr/sbin/zabbix_agentd"
  # Kubernetes control plane & node bileşenleri
  - "/usr/local/bin/kube-apiserver"
  - "/usr/local/bin/kube-controller-manager"
  - "/usr/local/bin/kube-scheduler"
  - "/usr/local/bin/kube-proxy"
  - "/usr/bin/kubelet"
  # Container runtime
  - "/usr/bin/containerd"
  - "/usr/local/bin/containerd"
  - "/usr/bin/containerd-shim-runc-v2"
