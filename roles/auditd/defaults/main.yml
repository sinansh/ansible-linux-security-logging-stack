---
# Defaults for auditd

# Auditd paket adı OS ailesine göre değişir:
#   Debian/Ubuntu → 'auditd'
#   RHEL/CentOS/Rocky/Alma → 'audit'  ('auditd' diye bir paket yoktur; kurulum
#   'No match for argument: auditd' ile başarısız olur)
auditd_package_name: "{{ 'auditd' if ansible_facts['os_family'] == 'Debian' else 'audit' }}"

# Path to audit.rules file
# Debian/Ubuntu: /etc/audit/rules.d/audit.rules (often merged) or /etc/audit/audit.rules
# RHEL/CentOS: /etc/audit/rules.d/audit.rules
audit_rules_path: "/etc/audit/rules.d/audit.rules"

# Log file group — rsyslog'un audit.log'u okuyabilmesi için.
# Debian/Ubuntu'da rsyslog 'syslog' kullanıcısı olarak çalışır → log_group=syslog
# audit.log'u root:syslog 0640 yapar ve auditd bunu rotasyonda korur (ACL yerine).
# RHEL/CentOS'ta rsyslog root'tur → 'root' yeterli (okuma SELinux modülüyle açılır).
auditd_log_group: "{{ 'syslog' if ansible_facts['os_family'] == 'Debian' else 'root' }}"

# Buffer size for audit messages
auditd_buffer_size: 8192

# Failure mode (0=silent, 1=printk, 2=panic)
auditd_failure_mode: 1
