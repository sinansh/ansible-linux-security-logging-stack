---
- name: Install auditd
  package:
    name: "{{ auditd_package_name }}"
    state: present
  become: true

# Debian/Ubuntu'da auditd.conf'taki log_group=syslog'un çalışması için 'syslog'
# kullanıcı/grubunun mevcut olması gerekir. Bunları rsyslog paketi oluşturur.
# Minimal/cloud 24.04 imajlarında rsyslog önyüklü OLMAYABİLİR ve auditd rolü
# rsyslog_siem rolünden ÖNCE çalışır → grubu burada garantiye alıyoruz.
- name: Ensure rsyslog is present so the 'syslog' group exists (Debian)
  package:
    name: rsyslog
    state: present
  become: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Deploy auditd configuration file
  template:
    src: auditd.conf.j2
    dest: /etc/audit/auditd.conf
    owner: root
    group: root
    mode: '0640'
  notify: Restart auditd
  become: true

- name: Deploy audit rules file
  template:
    src: audit.rules.j2
    dest: "{{ audit_rules_path }}"
    owner: root
    group: root
    mode: '0640'
  register: audit_rules_file
  become: true

# Servis kurallar deploy edildikten SONRA başlatılır —
# ilk çalıştırmada auditd boş kural setiyle kısa süre çalışmaz.
- name: Ensure auditd service is enabled and running
  systemd:
    name: auditd
    enabled: true
    state: started
  become: true

# Kuralları kernel'e yükleme, EskIDEN yalnızca "Deploy audit rules file"in tetiklediği
# bir handler'la yapılıyordu. Ancak play, kural dosyası deploy edildikten SONRA fakat
# handler'lar flush edilmeden ÖNCE herhangi bir yerde başarısız olursa (ör. sonraki
# rsyslog rolünde), kurallar kernel'e YÜKLENMEDEN kalır; sonraki run'larda dosya
# değişmediği için handler bir daha tetiklenmez → auditd sessizce kuralsız çalışır.
# Bu iki görev drift'i her koşulda kapatır — idempotent ve kendini onarır.
# NOT: 'augenrules --check' drift olsa bile rc=0 döndürür (çıktıya mesaj basar), o yüzden
# rc'ye güvenilmez; kernel'de GERÇEKTEN yüklü kural var mı diye 'auditctl -l'e bakıyoruz.
- name: Check whether audit rules are loaded in the kernel
  command: auditctl -l
  register: auditd_loaded_rules
  changed_when: false
  become: true

- name: Load audit rules into the kernel (on change or when none are loaded)
  command: augenrules --load
  when: audit_rules_file is changed or ('No rules' in auditd_loaded_rules.stdout)
  changed_when: true
  become: true

# ── Audispd syslog plugin: rsyslog ile çakışmayı önle ────────────────────────
- name: Check for auditd/audisp syslog plugin (new path)
  stat:
    path: /etc/audit/plugins.d/syslog.conf
  register: audit_syslog_new_path
  become: true

- name: Check for auditd/audisp syslog plugin (legacy path)
  stat:
    path: /etc/audisp/plugins.d/syslog.conf
  register: audit_syslog_legacy_path
  become: true

- name: Set auditd syslog plugin path variable
  set_fact:
    audit_syslog_conf_path: >-
      {{
        '/etc/audit/plugins.d/syslog.conf'  if audit_syslog_new_path.stat.exists else
        '/etc/audisp/plugins.d/syslog.conf' if audit_syslog_legacy_path.stat.exists else
        ''
      }}

# 'active = yes' satırını 'no' yap. lineinfile (ansible.builtin) kullanıyoruz ki
# hiçbir koleksiyona (community.general.ini_file) bağımlılık olmasın.
- name: Disable audispd syslog plugin to prevent log duplication
  lineinfile:
    path: "{{ audit_syslog_conf_path }}"
    regexp: '^\s*active\s*='
    line: 'active = no'
    mode: '0644'
  become: true
  notify: Restart auditd
  when: audit_syslog_conf_path != ''
