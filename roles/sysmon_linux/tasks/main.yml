---
# ─────────────────────────────────────────────────────────────────────────────
# PLATFORM DESTEĞİ
# Sysmon for Linux (Microsoft) yalnızca modern dağıtımlarda çalışır:
#   • Debian/Ubuntu
#   • RHEL/CentOS/Rocky/Alma 8+   (glibc >= 2.25, güncel libstdc++, eBPF'li kernel)
# CentOS/RHEL 7 DESTEKLENMEZ: MS yalnızca el8/el9 RPM yayınlar ve bu paket
#   libstdc++.so.6(CXXABI_1.3.9) / (GLIBCXX_3.4.21) ile glibc 2.25 ister; EL7'de
#   glibc 2.17 vardır → bağımlılık çözülemez ("Requires: ..." hatası). EL7 kernel'i
#   (3.10) Sysmon'un kullandığı eBPF özelliklerini de sağlamaz.
# Bu yüzden EL7'de rolü HATA vermeden ATLIYORUZ; host'un güvenlik kaydı auditd +
# command_logging + rsyslog->SIEM iletimiyle sağlanmaya devam eder.
# ─────────────────────────────────────────────────────────────────────────────
- name: Determine whether Sysmon for Linux is supported on this host
  set_fact:
    sysmon_supported: >-
      {{ not (ansible_facts['os_family'] == 'RedHat'
              and ansible_facts['distribution_major_version'] is version(sysmon_min_el_version, '<')) }}

- name: Warn that Sysmon is unsupported on this platform (skipping)
  debug:
    msg: >-
      Sysmon for Linux is not available on {{ ansible_distribution }}
      {{ ansible_distribution_major_version }} (requires EL{{ sysmon_min_el_version }}+ /
      glibc >= 2.25). Skipping the sysmon_linux role; auditd, command_logging and
      rsyslog->SIEM forwarding still provide coverage on this host.
  when: not (sysmon_supported | bool)

- name: Install and configure Sysmon for Linux
  when: sysmon_supported | bool
  block:
    - name: Include OS-specific installation tasks
      include_tasks: "install-{{ ansible_facts['os_family'] }}.yml"

    - name: Ensure Sysmon config directory exists
      file:
        path: "{{ sysmon_config_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Deploy Sysmon configuration
      template:
        src: sysmon-config.xml.j2
        dest: "{{ sysmon_config_path }}"
        owner: root
        group: root
        mode: '0644'
      become: true
      register: sysmon_config_file

    - name: Check if Sysmon service is active
      command: systemctl is-active sysmon
      register: sysmon_service_status
      failed_when: false
      changed_when: false
      become: true

    # 'sysmon -i' Sysmon for Linux'u DOĞRU şekilde kurar: config'i /opt/sysmon/config.xml'e
    # kopyalar, systemd birimini kendisi oluşturur
    #   (Type=forking, ExecStart=/opt/sysmon/sysmon -i /opt/sysmon/config.xml -service)
    # ve servisi başlatır. Sysmon olayları bir dosyaya/stdout'a DEĞİL, doğrudan
    # SYSLOG'a (programname/tag = "sysmon") yazılır; rsyslog_siem rolü bu tag'i
    # yakalayıp SIEM'e iletir. Bu yüzden burada özel unit / log dosyası YOK.
    - name: Install Sysmon (first-time setup)
      command: sysmon -i {{ sysmon_config_path }} -accepteula
      become: true
      when: (sysmon_service_status.rc | default(1)) != 0
      register: sysmon_first_install
      changed_when: true

    # ── Drift'e duyarlı reload ────────────────────────────────────────────────
    # Reload'u yalnızca /etc şablonu BU çalıştırmada "changed" olduğunda tetiklemek
    # YETERSİZ: canlı /opt config'i bir kez desired'dan saparsa (başarısız reload,
    # elle değişiklik, reimage, paket reinstall) sonraki çalıştırmalar dosya değişmediği
    # için reload'u ATLAR ve host sessizce eski kurallarla çalışmaya devam eder.
    # Bu yüzden çalışan config'i (/opt) desired ile (/etc) karşılaştırıp HERHANGİ bir
    # sapmada da reload ediyoruz. ('sysmon -c', /opt'u byte-identical yazdığı için bu
    # karşılaştırma idempotent: senkronken tekrar reload etmez.)
    - name: Read the desired Sysmon config (source of truth)
      slurp:
        src: "{{ sysmon_config_path }}"
      register: sysmon_desired_cfg
      become: true
      when: sysmon_first_install is skipped

    - name: Read the running Sysmon config (what the service actually loads)
      slurp:
        src: "{{ sysmon_runtime_config_path }}"
      register: sysmon_running_cfg
      become: true
      failed_when: false
      when: sysmon_first_install is skipped

    - name: Update Sysmon configuration (config changed or running config drifted)
      command: sysmon -c {{ sysmon_config_path }}
      become: true
      when:
        - sysmon_first_install is skipped
        - >-
          sysmon_config_file.changed
          or (sysmon_running_cfg.content | default('')) != (sysmon_desired_cfg.content | default(''))
      changed_when: true

    - name: Ensure Sysmon service is enabled and started
      systemd:
        name: sysmon
        state: started
        enabled: true
      become: true

    # ── Doğrulama ─────────────────────────────────────────────────────────────
    # Yeşil bir çalıştırma "kurallar canlı" ANLAMINA GELMELİ. Reload sessizce
    # uygulanmadıysa (ör. servis eski kuralları taşıyorsa) burada GÜRÜLTÜLÜ hata
    # veririz: yapılandırılan her exclusion, çalışan config içinde fiilen var mı?
    - name: Re-read the running Sysmon config for verification
      slurp:
        src: "{{ sysmon_runtime_config_path }}"
      register: sysmon_running_cfg_verify
      become: true

    - name: Assert configured exclusions are present in the RUNNING Sysmon config
      vars:
        _running: "{{ sysmon_running_cfg_verify.content | b64decode }}"
      assert:
        that:
          - item in _running
        fail_msg: >-
          Çalışan Sysmon config'i '{{ item }}' exclusion'ını içermiyor —
          reload uygulanmamış, host eski/eksik kurallarla log topluyor.
          'sysmon -c {{ sysmon_config_path }}' ve sysmon servisini kontrol edin.
        quiet: true
      loop: "{{ sysmon_excluded_network_images + sysmon_excluded_destination_ips }}"
      when: (sysmon_excluded_network_images | length) + (sysmon_excluded_destination_ips | length) > 0
