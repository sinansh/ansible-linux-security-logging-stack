---
- name: Install rsyslog
  package:
    name: rsyslog
    state: present
  become: true

# ─────────────────────────────────────────────────────────────────────────────
# LOG ERİŞİMİ
# - Auditd:  imfile /var/log/audit/audit.log dosyasını okur. Okuma izni auditd'nin
#            kendi 'log_group' direktifiyle veriliyor (bkz. auditd rolü) — Debian'da
#            log_group=syslog → audit.log root:syslog 0640 olur, rsyslog (syslog
#            kullanıcısı) okur. ACL kullanmıyoruz çünkü auditd dosyayı her
#            rotasyon/restart'ta yeniden chmod ederek ACL mask'ini sıfırlıyor.
# - Sysmon:  bir dosyaya yazmaz; olayları doğrudan SYSLOG'a (programname="sysmon")
#            gönderir. Aşağıdaki rsyslog kuralı bu tag'i yakalayıp iletir; ekstra
#            izin/okuma gerekmez.
# ─────────────────────────────────────────────────────────────────────────────

# ─────────────────────────────────────────────────────────────────────────────
# SELINUX (yalnızca RHEL/CentOS, SELinux enabled)
# CentOS 8'de SELinux enforcing'dir ve iki şeyi engeller:
#   1) rsyslog'un (syslogd_t) SIEM'e ağ bağlantısı açmasını  → boolean ile aç.
#   2) rsyslog'un imfile ile auditd loglarını (auditd_log_t) okumasını → küçük
#      bir özel policy modülü ile izin ver. (RHEL'de rsyslog root'tur, DAC ile
#      okur ama SELinux yine de reddeder.)
# ─────────────────────────────────────────────────────────────────────────────
- name: Configure SELinux to allow rsyslog forwarding and audit-log reads
  when:
    - ansible_facts['os_family'] == 'RedHat'
    - (ansible_facts.selinux.status | default('disabled')) == 'enabled'
  become: true
  block:
    # seboolean (ansible.posix) yerine builtin command kullanıyoruz ki hiçbir
    # koleksiyon bağımlılığı olmasın. getsebool ile idempotensi sağlıyoruz.
    - name: Check syslogd_can_network_connect SELinux boolean
      command: getsebool syslogd_can_network_connect
      register: sebool_net_state
      changed_when: false

    - name: Allow rsyslog to make outbound network connections (omfwd)
      command: setsebool -P syslogd_can_network_connect on
      when: "'--> on' not in sebool_net_state.stdout"
      changed_when: true

    - name: Ensure SELinux policy build tools are present
      package:
        name:
          - checkpolicy
          - policycoreutils
        state: present

    - name: Ensure local SELinux module directory exists
      file:
        path: /etc/selinux/local
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Deploy SELinux policy source allowing rsyslog to read audit logs
      copy:
        dest: /etc/selinux/local/rsyslog_read_audit.te
        owner: root
        group: root
        mode: '0640'
        content: |
          module rsyslog_read_audit 1.0;

          # NOTE: rsyslog'un domain'i RHEL/CentOS'ta 'syslogd_t' (rsyslogd_t DEĞİL).
          require {
              type syslogd_t;
              type auditd_log_t;
              class dir { search open read getattr };
              class file { open read getattr ioctl lock };
          }

          allow syslogd_t auditd_log_t:dir { search open read getattr };
          allow syslogd_t auditd_log_t:file { open read getattr ioctl lock };
      register: selinux_audit_te

    - name: Compile SELinux module (checkmodule)
      command: >-
        checkmodule -M -m
        -o /etc/selinux/local/rsyslog_read_audit.mod
        /etc/selinux/local/rsyslog_read_audit.te
      when: selinux_audit_te.changed
      changed_when: true

    - name: Package SELinux module (semodule_package)
      command: >-
        semodule_package
        -o /etc/selinux/local/rsyslog_read_audit.pp
        -m /etc/selinux/local/rsyslog_read_audit.mod
      when: selinux_audit_te.changed
      changed_when: true

    - name: Install SELinux module (semodule)
      command: semodule -i /etc/selinux/local/rsyslog_read_audit.pp
      when: selinux_audit_te.changed
      changed_when: true
      notify: Restart rsyslog

# ── rsyslog konfigürasyonu ──────────────────────────────────────────────────
- name: Deploy rsyslog SIEM forwarding config
  template:
    src: rsyslog-siem.conf.j2
    dest: /etc/rsyslog.d/30-siem.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart rsyslog
  become: true

# Eski sürüm 99-siem.conf bıraktıysa (sysmon imfile içeren) temizle.
- name: Remove legacy 99-siem.conf from previous deployments
  file:
    path: /etc/rsyslog.d/99-siem.conf
    state: absent
  notify: Restart rsyslog
  become: true

- name: Ensure rsyslog is enabled and started
  systemd:
    name: rsyslog
    enabled: true
    state: started
  become: true
